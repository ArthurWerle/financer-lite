services:
  financer-lite:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    pull_policy: build
    networks:
      - financer-services_back-end

networks:
  financer-services_back-end:
    external: true
